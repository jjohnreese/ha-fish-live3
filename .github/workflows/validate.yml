name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  hacs:
    name: Marketplace / HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@master
  tests:
    name: Source and behavior checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-test.txt
      - run: pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/check_public_tree.py
      - run: python scripts/package_integration.py
      - run: python scripts/check_public_tree.py --zip dist/fish_live3.zip
      - uses: actions/upload-artifact@v4
        with:
          name: integration-package
          path: dist/fish_live3.zip
  worker:
    name: Worker Linux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t housetalk-worker-test fish_live3_worker
      - name: Start worker without private configuration
        run: |
          docker run -d --name housetalk-worker-test -p 127.0.0.1:18789:8789 housetalk-worker-test
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:18789/health; then exit 0; fi
            sleep 1
          done
          docker logs housetalk-worker-test
          exit 1
  windows:
    name: Windows clean build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: Copy-Item -LiteralPath custom_components/fish_live3/www/house-talk.js -Destination windows/HouseTalk/www/house-talk.js -Force
      - run: python scripts/collect_npm_licenses.py
      - run: ./scripts/package_windows.ps1
      - run: ./dist/HouseTalk/HouseTalk.exe --self-test
      - run: python scripts/check_public_tree.py --zip dist/HouseTalk-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: dist/HouseTalk-Windows-x64.zip
